# Publikuje grę z folderu gra/ na GitHub Pages po każdym pushu na master.
# Na stronę trafia tylko to, czego potrzebuje gracz: moduły (*.html) i obrazy (img/). Makiety i docs/ zostają w repo.
name: GitHub Pages

on:
  push:
    branches: [master]
    paths: ['gra/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Złóż stronę z gry
        run: |
          mkdir _site
          cp gra/*.html _site/
          cp -r gra/img _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
